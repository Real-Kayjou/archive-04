   - container: any element; the canvas fills it (give it position:fixed; inset:0; z-index:0 to sit behind your site)

/* DEEP OCEAN background: drop-in, no dependencies.
   Usage: const dispose = DeepOcean(container, { creature: () => ({ x: 0.5, y: 0.5 }) });
   - container: any element; the canvas fills it (give it position:fixed; inset:0; z-index:0 to sit behind your site)
   - creature: optional function returning the 3D object's centre in 0..1 screen coords (y down). Default: centre.
   The water ripples outward from the creature in time with its pulse, and reacts to the cursor/finger. */
function DeepOcean(container, opts) {
  opts = opts || {};
  const creature = opts.creature || (() => ({ x: 0.5, y: 0.5 }));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'display:block;width:100%;height:100%';
  const gl = cv.getContext('webgl', { antialias: false, alpha: false });
  container.style.background = 'linear-gradient(0deg,#040B27,#121F50)';
  if (!gl) return function () {};
  container.appendChild(cv);

  const FS = `precision highp float;
  uniform vec2 uRes, uM; uniform vec4 uCV[8]; uniform float uT, uMS, uPs[8], uSz[8];
  float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+1.),f.x), f.y); }
  float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+7.1; a*=.5; } return s; }
  float asp;
  void main(){
    vec2 uv=gl_FragCoord.xy/uRes; asp=uRes.x/uRes.y; float t=uT;
    vec3 obs=vec3(.016,.043,.153), mid=vec3(.071,.122,.314), slate=vec3(.165,.231,.502), iris=vec3(.259,.333,.698), med=vec3(.384,.455,.878);
    vec2 w=uv; float pg=0.;
    for(int i=0;i<8;i++){ vec2 dv=(uv-uCV[i].xy)*vec2(asp,1.); float cd0=length(dv);
      float fo=exp(-cd0*cd0*7./max(uSz[i]*uSz[i],.2));
      vec2 push=dv/(cd0+.03)*fo*uPs[i]*.04*min(uSz[i],1.); push.x/=asp;
      w-=push+uCV[i].zw*fo*.35; pg+=fo*uPs[i]; }
    vec2 p=w*vec2(asp,1.);
    vec2 q=vec2(fbm(p*1.4+vec2(0.,t*.03)), fbm(p*1.4+5.2-t*.025));
    float d=w.y;
    vec3 col=mix(obs,mid,smoothstep(0.,.8,d));
    col=mix(col,slate,smoothstep(.6,1.,d)*.35);
    float ray=fbm(vec2((p.x+w.y*.4)*3.+q.x*1.5, t*.035));
    col+=iris*smoothstep(.45,.8,ray)*pow(d,2.4)*.17;
    float c=fbm(p*vec2(3.,5.)+q*2.+t*.04);
    col+=iris*pow(smoothstep(.5,.78,c),2.)*smoothstep(.25,1.,d)*.09;
    col+=iris*pg*.05;
    for(int i=0;i<8;i++){ float cd=length((uv-uCV[i].xy)*vec2(asp,1.));
      col+=iris*exp(-cd*cd*7./max(uSz[i]*uSz[i],.2))*.11*min(uSz[i],1.)*(.85+.15*sin(t*2.2+float(i))); }
    col+=iris*exp(-length((uv-uM)*vec2(asp,1.))*7.)*.05*uMS;
    float pf=0.;
    for(int L=0;L<3;L++){
      float fl=float(L); float s=24.+fl*26.;
      pf=0.; vec2 sh=vec2(0.);
      for(int i=0;i<8;i++){ vec2 pd=(uv-uCV[i].xy)*vec2(asp,1.); float pdl=length(pd); float f2=exp(-pdl*pdl*8./max(uSz[i]*uSz[i],.2)); vec2 pdir=pd/(pdl+.02);
        float sc=.4+.6*min(uSz[i],1.2);
        sh+=(pdir*(.2+.06*uPs[i])+vec2(-pdir.y,pdir.x)*.035)*f2*sc*(1.2-.3*fl)+uCV[i].zw*vec2(asp,1.)*f2*.5; pf=max(pf,f2); }
      vec2 pp=(uv*vec2(asp,1.)-sh)*s; pp.y-=t*(.9+fl*.35); pp.x+=t*.25*(fl+1.)+sin(t*.7+fl*2.+pp.y*.3)*1.1; pp.x+=sin(t*2.3+pp.y*1.7+fl)*pf*.4; pp.y+=cos(t*1.9+pp.x*1.3)*pf*.3;
      vec2 cell=floor(pp), f=fract(pp)-.5, o=(vec2(hash(cell+1.),hash(cell+2.))-.5)*.3;
      o+=vec2(sin(t*1.1+hash(cell+3.)*30.),cos(t*.9+hash(cell+4.)*30.))*.3; float hh=hash(cell), dd=length(f-o);
      float r=mix(.18,.08,fl/2.)*(.8+.4*sin(t*1.3+hh*40.)), soft=mix(2.4,1.1,fl/2.);
      float tw=.5+.5*sin(t*(.4+hh)+hh*30.);
      float a=smoothstep(r*soft,0.,dd)*step(.55,hh)*tw;
      col+=mix(slate,med,hh)*a*mix(.8,.45,fl/2.)*(.35+.65*smoothstep(0.,.9,d))*(1.+pf*1.6);
    }
    col*=1.-.4*length(uv-.5);
    col+=(hash(gl_FragCoord.xy+t)-.5)/255.;
    gl_FragColor=vec4(col,1.);
  }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(pr)); return function () {}; }
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  const uRes = U('uRes'), uT = U('uT'), uM = U('uM'), uMS = U('uMS'), uCV = U('uCV[0]'), uPs = U('uPs[0]'), uSz = U('uSz[0]');


  const m = { x: 0.5, y: 0.5, s: 0, on: false, lx: 0, ly: 0, lt: 0 };
  function onMove(e) {
    const r = container.getBoundingClientRect();
    m.x = (e.clientX - r.left) / r.width; m.y = 1 - (e.clientY - r.top) / r.height; m.on = true;
  }
  function onLeave() { m.on = false; }
  addEventListener('pointermove', onMove); document.addEventListener('mouseleave', onLeave);

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1);
    cv.width = Math.max(2, Math.round(container.clientWidth * dpr));
    cv.height = Math.max(2, Math.round(container.clientHeight * dpr));
    gl.viewport(0, 0, cv.width, cv.height);
  }
  addEventListener('resize', resize); resize();

  const sv = [], sp = [], bufCV = new Float32Array(32), bufP = new Float32Array(8), bufS = new Float32Array(8);
  const t0 = performance.now() / 1000; let raf, nextPulse = 0, active = !document.hidden;
  function loop() {
    if (!active) return;
    raf = requestAnimationFrame(loop);
    const t = (performance.now() / 1000 - t0) * (reduce ? 0.3 : 1);
    let cs = creature(); if (!Array.isArray(cs)) cs = [cs];
    m.s += ((m.on ? 1 : 0) - m.s) * 0.05;
    for (let i = 0; i < 8; i++) {
      const c = cs[i];
      if (!sv[i]) { sv[i] = { x: 0, y: 0 }; sp[i] = 0; }
      if (!c) { bufCV.set([-9, -9, 0, 0], i * 4); bufP[i] = 0; bufS[i] = 0.05; continue; }
      sv[i].x += ((c.vx || 0) - sv[i].x) * 0.08; sv[i].y += ((c.vy || 0) - sv[i].y) * 0.08; sp[i] += ((c.pulse || 0) - sp[i]) * 0.2;
      bufCV.set([c.x, 1 - c.y, sv[i].x, sv[i].y], i * 4); bufP[i] = sp[i]; bufS[i] = c.sz || 1;
    }
    gl.uniform2f(uRes, cv.width, cv.height); gl.uniform1f(uT, t);
    gl.uniform2f(uM, m.x, m.y); gl.uniform1f(uMS, m.s);
    gl.uniform4fv(uCV, bufCV); gl.uniform1fv(uPs, bufP); gl.uniform1fv(uSz, bufS);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function onVisibility(){ active = !document.hidden; if (active && !raf) loop(); if (!active) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', onVisibility);
  container.__setActive = function (value) { active = value !== false && !document.hidden; if (active && !raf) loop(); if (!active) { cancelAnimationFrame(raf); raf = 0; } };
  loop();

  return function dispose() {
    cancelAnimationFrame(raf);
    document.removeEventListener('visibilitychange', onVisibility);
    delete container.__setActive;
    removeEventListener('pointermove', onMove); document.removeEventListener('mouseleave', onLeave);
    removeEventListener('resize', resize);
    if (cv.parentNode) cv.parentNode.removeChild(cv);
  };
}

/* two creatures touch: they freeze, stare at each other (eyes wide, rapid blinks, squish, flailing tendrils, speech bubble),
   then dart off in different directions. Called once per pair, with a cooldown so they don't re-bump instantly. */
const BUBBLES = ['!', '?', '!?', '…', '♥', '♪', '✦'];
function SymbioteBump(a, b, t) {
  const ang = Math.atan2(b.y - a.y, b.x - a.x), dur = 1.4 + Math.random() * 0.9;
  a.cool[b.id] = b.cool[a.id] = t + 5;
  [[a, b, ang], [b, a, ang + Math.PI]].forEach(([c, other, to]) => {
    c.mode = 'bump'; c.until = t + dur; c.bt = t; c.kick = 1; c.other = other;
    c.vx = -Math.cos(to) * 0.35; c.vy = -Math.sin(to) * 0.35;          /* recoil */
    c.launch = to + Math.PI + (Math.random() - 0.5) * 2.4;           /* fly off a new way */
    c.say = BUBBLES[Math.floor(Math.random() * BUBBLES.length)];
  });
}

function SymbiotePupil(container, opts) {
  const shared = opts && opts.__shared;
  const O = Object.assign({ tone: 1, scale: 0.85, tendrils: 44, arc: 6.2832, arcStart: 0, lenMul: 1, thick: 1, core: [1, 1, 1], bump: 0.14, freq: 1.4,
    eye: 1, seg: 128, speed: 1, stare: 0.8, id: 0, swarm: null }, opts || {});
  const W = () => container.clientWidth, H = () => container.clientHeight;
  const renderer = shared ? shared.renderer : new THREE.WebGLRenderer({ antialias: true, alpha: true });
  if (!shared) renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(W(), H());
  if (!shared) container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = shared ? shared.camera : new THREE.PerspectiveCamera(40, W() / H(), 0.1, 100);
  if (!shared) camera.position.set(0, 0, 7.5);
  if (shared) shared.scenes.push(scene);

  const uTime = { value: 0 };

  const NOISE = `
    vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
    vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
    vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g;
      vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
      i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
      float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.*floor(p*ns.z*ns.z);
      vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy;
      vec4 h=1.-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.;
      vec4 sh=-step(h,vec4(0.));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
      m=m*m;
      return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
    /* palette ramp: #121F50 -> #2A3B80 -> #4255B2 -> #6274E0, ping-pongs with t */
    vec3 irid(float t){
      float p=abs(fract(t)*2.-1.)*3.;
      vec3 c1=vec3(.071,.122,.314), c2=vec3(.165,.231,.502), c3=vec3(.259,.333,.698), c4=vec3(.384,.455,.878);
      vec3 c=mix(c1,c2,clamp(p,0.,1.));
      c=mix(c,c3,clamp(p-1.,0.,1.));
      c=mix(c,c4,clamp(p-2.,0.,1.));
      return c;
    }
  `;

  const group = new THREE.Group();
  scene.add(group); group.scale.setScalar(O.scale);

  /* ---- glow behind ---- */
  function radialTex(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'); const gr = g.createRadialGradient(128,128,0,128,128,128);
    stops.forEach(s => gr.addColorStop(s[0], s[1]));
    g.fillStyle = gr; g.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTex([[0,'rgba(98,116,224,0.55)'],[0.4,'rgba(42,59,128,0.28)'],[1,'rgba(4,11,39,0)']]),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  glow.scale.set(9 * O.scale / 0.85, 9 * O.scale / 0.85, 1); glow.position.z = -1.5;
  scene.add(glow);

  /* ---- goo core ---- */
  const gooMat = new THREE.ShaderMaterial({
    uniforms: { uTime },
    vertexShader: NOISE + `
      uniform float uTime; varying vec3 vN; varying vec3 vV; varying vec3 vP;
      float disp(vec3 p){
        float calm=1.-smoothstep(.5,.9,normalize(p).z)*.85; /* front face stays smooth so the eyes sit clean */
        return (snoise(p*${O.freq.toFixed(3)}+vec3(0.,uTime*.35,0.))*${O.bump.toFixed(3)} + snoise(p*${(O.freq*2.3).toFixed(3)}-uTime*.5)*${(O.bump*.3).toFixed(3)})*calm;
      }
      void main(){
        vec3 n=normalize(normal);
        vec3 t=normalize(cross(n,abs(n.y)>.9?vec3(1.,0.,0.):vec3(0.,1.,0.)));
        vec3 b=cross(n,t); float e=.02;
        vec3 p0=position+n*disp(position);
        vec3 q1=position+t*e; q1+=n*disp(q1);
        vec3 q2=position+b*e; q2+=n*disp(q2);
        vec3 nn=normalize(cross(q1-p0,q2-p0)); if(dot(nn,n)<0.) nn=-nn;
        vN=normalize(normalMatrix*nn); vP=p0;
        vec4 mv=modelViewMatrix*vec4(p0,1.);
        vV=normalize(-mv.xyz);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader: NOISE + `
      uniform float uTime; varying vec3 vN; varying vec3 vV; varying vec3 vP;
      void main(){
        vec3 N=normalize(vN), V=normalize(vV);
        float f=pow(1.-max(dot(N,V),0.),2.4);
        vec3 col=vec3(.012,.025,.07)*${O.tone.toFixed(2)};
        col+=irid(f*1.1+uTime*.06)*f*${(1.7*O.tone).toFixed(2)};
        vec3 R=reflect(-V,N);
        float streak=smoothstep(.86,1.,sin(R.y*9.+R.x*3.+uTime*.4));
        col+=vec3(.5,.58,1.)*streak*.3*(.3+f);
        vec3 L=normalize(vec3(-.5,.7,.8));
        float s=pow(max(dot(reflect(-L,N),V),0.),70.);
        col+=vec3(.82,.88,1.)*s*.9;
        float veins=smoothstep(.55,.62,snoise(vP*4.+uTime*.2));
        col+=irid(.7+uTime*.1)*veins*${(.3*O.tone).toFixed(2)};
        gl_FragColor=vec4(col,1.);
      }`
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(1, O.seg, O.seg), gooMat);
  group.add(core);

  /* ---- tendrils ---- */
  const tendrilVS = `
    uniform float uTime, uPhase, uLen, uAmp, uFollow; uniform vec3 uTarget; varying vec3 vN; varying vec3 vV; varying float vT;
    void main(){
      float t=clamp(position.y,0.,1.); vT=t;
      vec3 p=position; p.y*=uLen;
      p.x+=sin(t*5.5+uTime*1.8+uPhase)*uAmp*t;
      p.z+=cos(t*4.2+uTime*1.4+uPhase*1.7)*uAmp*t;
      /* cursor pull: each tendril leans toward the smoothed target by its own amount */
      vec3 d=uTarget-vec3(0.,p.y,0.);
      float l=length(d.xz);
      vec2 dir=l>.0001?d.xz/l:vec2(0.);
      p.xz+=dir*min(l,1.3)*uFollow*t*t;
      vN=normalize(normalMatrix*normal);
      vec4 mv=modelViewMatrix*vec4(p,1.);
      vV=normalize(-mv.xyz);
      gl_Position=projectionMatrix*mv;
    }`;
  const tendrilFS = NOISE + `

    mouse.s += ((mouse.on ? 1 : 0) - mouse.s) * 0.05;
    for (const o of tendrils) {
      if (kick) { o.v.x += (Math.random() - 0.5) * 0.8; o.v.z += (Math.random() - 0.5) * 0.8; }
      tmp.copy(trailW); o.mesh.worldToLocal(tmp);
      tmp2.copy(baseW); o.mesh.worldToLocal(tmp2); tmp.sub(tmp2); tmp.y = 0;
      o.v.x += ((tmp.x - o.cur.x) * o.st - o.v.x * o.dm) * dt;
      o.v.z += ((tmp.z - o.cur.z) * o.st - o.v.z * o.dm) * dt;
      o.cur.x += o.v.x * dt; o.cur.z += o.v.z * dt;
      o.mat.uniforms.uTarget.value.copy(o.cur);
    }
    /* eye: iris tilts toward cursor, jagged pupil shifts more (depth), pupil breathes, blinks */
    if (t > nextBlink) { blinkStart = t; nextBlink = t + (SW.mode === 'bump' ? 0.7 : 2.5 + Math.random() * 3.5); }
    const bp = (t - blinkStart) / 0.16;
    const blink = bp >= 0 && bp <= 1 ? 1 - 0.92 * Math.sin(Math.PI * bp) : 1;
    tmp.copy(lookW);
    eye.worldToLocal(tmp);
    const elen = Math.hypot(tmp.x, tmp.y) || 1;
    const reach = Math.min(elen / 1.6, 1);
    const cx = (tmp.x / elen) * reach, cy = (tmp.y / elen) * reach;
    const ix = Math.sin(t * 0.7) * 0.35, iy = Math.cos(t * 0.5) * 0.25;
    const tx = ix + (cx - ix) * SW.look, ty = iy + (cy - iy) * SW.look;
    eyeLook.x += (tx - eyeLook.x) * 0.16; eyeLook.y += (ty - eyeLook.y) * 0.16;
    rot.rotation.y = eyeLook.x * 0.28; rot.rotation.x = -eyeLook.y * 0.28;
    pupilM.position.set(eyeLook.x * EYE_R * 0.36, eyeLook.y * EYE_R * 0.36, 0.004);
    pupilM.scale.setScalar(1 + Math.sin(t * 1.6) * 0.05 - Math.min(Math.hypot(eyeLook.x, eyeLook.y), 1) * 0.08 + (SW.mode === 'bump' ? 0.12 * Math.min(1, (t - SW.bt) * 3) : 0));
    eye.scale.set(O.eye, O.eye * blink, 1);
  }
  if (shared) shared.updates.push(tick);
  else (function loop() { raf = requestAnimationFrame(loop); tick(); renderer.render(scene, camera); })();

  return function dispose() {
    cancelAnimationFrame(raf);
    if (shared) {
      const updateIndex = shared.updates.indexOf(tick);
      if (updateIndex >= 0) shared.updates.splice(updateIndex, 1);
      const sceneIndex = shared.scenes.indexOf(scene);
      if (sceneIndex >= 0) shared.scenes.splice(sceneIndex, 1);
    }
    window.removeEventListener('pointermove', onMove);
    document.removeEventListener('mouseleave', onLeave);
    if (!shared) {
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
  };
}

  { id: 6, pupil: 'cross',   tone: 1.8,  scale: 0.30, tendrils: 20, arc: 1.0, arcStart: -Math.PI / 2 - 0.5, lenMul: 1.9, thick: 0.55, core: [0.7, 1.5, 0.7], bump: 0.1, eye: 1.0, speed: 1.15, seg: 56 }, /* brightest squid */
  { id: 7, pupil: 'trio',    tone: 0.6,  scale: 0.25, tendrils: 60, lenMul: 0.4, thick: 0.5, bump: 0.22, freq: 3.2, eye: 1.1, speed: 1.0, seg: 48 }                         /* fuzzy puffball */
];
function SymbiotePack(containers) {
  const swarm = [];
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.autoClear = false;
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 0, 7.5);
  const shared = { renderer, camera, clock: new THREE.Clock(), updates: [], scenes: [] };
  containers[0].appendChild(renderer.domElement);
  const d = containers.map((c, i) => SymbiotePupil(c, Object.assign({ swarm, stare: 0.3, __shared: shared }, SYMBIOTE_SPECS[i])));
  function resize() {
    const w = containers[0].clientWidth, h = containers[0].clientHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.position.z = camera.aspect < 1 ? 7.5 / Math.max(camera.aspect, 0.55) : 7.5; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  let raf, active = !document.hidden;
  function loop() {
    if (!active) return;
    raf = requestAnimationFrame(loop);
    for (const update of shared.updates) update();
    renderer.clear();
    for (const scene of shared.scenes) { renderer.clearDepth(); renderer.render(scene, camera); }
  }
  function onVisibility(){ active = !document.hidden; if (active && !raf) loop(); if (!active) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', onVisibility);
  containers[0].__setActive = function (value) { active = value !== false && !document.hidden; if (active && !raf) loop(); if (!active) { cancelAnimationFrame(raf); raf = 0; } };
  loop();
  return function dispose() { active = false; cancelAnimationFrame(raf); document.removeEventListener('visibilitychange', onVisibility); delete containers[0].__setActive; removeEventListener('resize', resize); d.forEach(f => f()); renderer.dispose(); if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); };
}
